        - strong: This browser
    - button "Search guides Ctrl K"
    - navigation "Workspace":
        - link /Library \d+/:
            - /url: /
        - link "Collections 6":
            - /url: /?collections=1
        - link "Drafts 9":
            - /url: /?status=draft
        - link "Published":
            - /url: /?status=published
        - link "Archived":
            - /url: /?status=archived
    - paragraph: Collections
