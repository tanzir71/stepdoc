- main:
  - region "Record it once. People read it. Agents run it.":
    - paragraph: Open source · Self-hosted · Agent-readable
    - heading "Record it once. People read it. Agents run it." [level=1]
    - paragraph: StepDoc turns a browser workflow into a step-by-step guide your team edits and publishes — plus a replay file any browser agent can follow. Run it in your browser, on shared hosting, on Cloudflare, or publish to GitHub Pages.
    - link "Add to Chrome — free":
      - /url: ./site/docs/#browser
    - link "Deploy to your host":
      - /url: ./site/docs/#self-host
    - paragraph: No account needed in local mode · Chrome, Edge and Firefox
