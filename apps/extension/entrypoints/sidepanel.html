<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="manifest.include" content="['chrome', 'edge']" />
    <title>StepDoc Capture</title>
  </head>
  <body>
    <div class="card">
      <header><h1>StepDoc</h1></header>
      <main>
        <p id="status" role="status">Ready to capture</p>
        <button id="start">Start capture</button
        ><button id="stop" class="secondary">Stop &amp; open</button
        ><button id="retry" class="secondary">Retry saved upload</button
        ><button id="cancel" class="danger">Cancel</button>
      </main>
      <footer>
        <nav aria-label="StepDoc">
          <a href="app.html" target="_blank" data-sd="capture-library"
            >Open library</a
          ><a href="options.html" target="_blank">Settings</a>
        </nav>
      </footer>
    </div>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
