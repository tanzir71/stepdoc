  - region "Frequently asked questions":
    - group:
      - text: Does it work without a server?
      - paragraph: Yes. Install the extension and choose “This browser”. Guides, screenshots and versions stay in IndexedDB; export a .stepdoc bundle or pair a server later.
    - group:
      - text: What actually runs on shared hosting?
      - paragraph: A static app plus one PHP front controller and a SQLite file outside public_html. Image work happens in the browser, so no Imagick or headless Chrome is needed.
    - group:
      - text: How does an agent use a guide?
      - paragraph: Point it at the guide URL or llms.txt. It gets role + name targets and expected results per step, or run the generated Playwright spec in CI.
    - group:
      - text: Is anything sent to an AI provider?
      - paragraph: Only if you add your own key, and only DOM context (no screenshots). Rules-based step text works with AI switched off.
