    - strong: You
    - button "General settings"
- banner:
    - heading "Library" [level=1]
    - paragraph: /\d+ guides · 6 collections · stored in this browser/
    - text: Filter guides
    - searchbox "Filter guides"
    - button "Import"
    - button "Import guide JSON"
    - button "New guide"
