        - img "Enabled in this illustration"
        - text: GitHub Pages Live Embed
  - region "Guides a browser agent can actually follow.":
    - paragraph: Built for agents
    - heading "Guides a browser agent can actually follow." [level=2]
    - paragraph: Agents read the accessibility tree, not pixels. Every StepDoc guide and every app screen is built around that.
    - list:
      - listitem: Targets stored as role + accessible name first, selectors as fallback
      - listitem: Expected result per step, so an agent knows it worked
      - listitem: Typed values become variables or secrets — never stored
      - listitem: guide.json, guide.md, Playwright spec and SKILL.md on every guide
      - listitem: llms.txt, JSON-LD and Markdown alternates on published sites
      - listitem: MCP + WebMCP integration on the v2 roadmap
    - figure "Planned WebMCP integration example":
      - text: app.js
      - code: "// Integration preview; same tools as the planned MCP server const mc = document.modelContext ?? navigator.modelContext; mc?.registerTool({ name: 'export_guide', description: 'Export a guide as pdf, html, md, json or playwright', inputSchema: guideExportSchema, // from @stepdoc/schema execute: ({ id, format }) => stepdoc.export(id, format), }); // Also registered: list_guides · get_guide · create_guide // add_step · update_step · publish_guide"
  - region "Nothing leaves your storage unless you publish it.":
    - paragraph: Privacy
    - heading "Nothing leaves your storage unless you publish it." [level=2]
    - article:
      - heading "Typed values never recorded" [level=3]
      - paragraph: "Inputs are stored as actions: “Fill in the Invoice email field”. Passwords and secrets never touch disk."
      - code: "value: { kind: \"secret\" }"
    - article:
      - heading "Blur before upload" [level=3]
      - paragraph: Pattern detectors run in the extension. The server only ever receives already-redacted pixels.
      - code: redactions[] kept as layers
    - article:
      - heading "Your storage, your keys" [level=3]
      - paragraph: SQLite on your host, D1 + R2 on your account, or your browser. AI is optional and bring-your-own-key.
      - code: no StepDoc cloud in the loop
