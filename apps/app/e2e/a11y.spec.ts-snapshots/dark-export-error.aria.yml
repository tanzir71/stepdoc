- link "Skip to editor":
    - /url: '#main'
- banner:
    - navigation "Guide navigation":
        - link "Library":
            - /url: /
        - link "Finance ops":
            - /url: /?collection=finance-ops
    - heading "Upgrade a workspace to the Team plan" [level=1]:
        - button "Upgrade a workspace to the Team plan"
    - text: Draft
    - button /Saved, version \d+\. Open history\./:
        - status: Saved · v13
    - tablist "Editor mode":
        - tab "Edit" [selected]
        - tab "Preview"
        - tab "Agent view"
    - button "Read guide"
    - button "Copy link"
    - button "Export & publish"
- dialog "Export & publish":
    - banner:
        - heading "Export & publish" [level=2]
        - paragraph: Upgrade a workspace to the Team plan · 9 steps · v13
        - button "Close export dialog"
    - group "Download":
        - checkbox "PDF"
        - text: PDF Print-ready, one step per block
        - checkbox "HTML" [checked]
        - text: HTML Single file, images inlined
        - checkbox "Markdown"
        - text: Markdown .md + images, zipped
        - checkbox "DOCX"
        - text: DOCX Editable Word document
        - checkbox ".stepdoc"
        - text: .stepdoc Re-importable bundle
        - checkbox "guide.json"
        - text: guide.json Agent Replay contract, schema v1
        - checkbox "Playwright"
        - text: Playwright Agent replay.spec.ts
        - checkbox "SKILL.md"
        - text: SKILL.md Agent Agent skill folder
    - complementary "Sharing and hosting options":
        - heading "Publish" [level=3]
        - region "Local link":
            - heading "Local link" [level=4]
            - paragraph: This browser only
            - switch "Public links require a server workspace" [disabled]
            - button "Copy local link"
            - group: Copy text
        - region "Files for GitHub Pages":
            - heading "GitHub Pages" [level=4]
            - paragraph: Files for your repository
            - checkbox "Include HTML, JSON and Markdown"
            - text: HTML, JSON and Markdown
            - checkbox "Include replay.spec.ts"
            - text: Include replay.spec.ts
            - checkbox "Include SKILL.md"
            - paragraph: Downloads do not publish your guide.
        - region "Files for Cloudflare Pages":
            - heading "Cloudflare Pages" [level=4]
            - button "Select HTML" [pressed]
    - alert: The export could not finish. Check that its images are available, then retry. Your guide was kept.
    - contentinfo:
        - text: 0 open redaction items
        - button "Download 1 format"
        - button "Print PDF" [disabled]
- main:
    - tabpanel "Edit":
        - complementary "Guide steps":
            - heading "Steps" [level=2]
            - button "Clean up"
            - button "Add step"
            - button "Search steps"
            - listbox "Guide steps":
                - option /\d+ Go to app\.ledgerly\.io\/settings navigate · button/
                - option /\d+ Click "Billing" in the sidebar click · link/
                - option /\d+ Click "Change plan" click · button/ [selected]
                - option /\d+ Select "Team — \$\d+ \/ month" from the Plan dropdown select · combobox/
                - option /\d+ Click here click · button Review/
                - 'option /\d+ Fill in the "Seats" field fill · spinbutton · \{seats\}/'
                - option /\d+ Fill in the "Invoice email" field fill · textbox · secret/
                - option /\d+ Click "Save changes" click · button/
                - option /\d+ Check the "Plan updated" message assert · button/
            - button "Add step"
            - button "Add image"
        - region "Selected step":
            - toolbar "Image annotation tools":
                - button "Select layer" [disabled] [pressed]
                - button "Add blur" [disabled]
                - button "Crop screenshot" [disabled]
                - button "Add arrow" [disabled]
                - button "Add rectangle" [disabled]
                - button "Add text annotation" [disabled]
                - button "Add pin" [disabled]
                - button "Undo edit" [disabled]
                - button "Redo edit" [disabled]
                - combobox "Image zoom":
                    - option "Fit" [selected]
                    - option /\d+%/
                    - option /\d+%/
                    - option /\d+%/
                    - option /\d+%/
                    - option /\d+%/
                    - option /\d+%/
            - paragraph: Image unavailable on this device.
            - button "Replace image"
            - textbox "Step title": Click "Change plan"
            - text: Replay passed Step description
            - textbox "Step description": Opens the plan picker. Only workspace owners see this button; members get a "Request upgrade" link instead.
            - text: click · button app.ledgerly.io/settings/billing
            - region "Layers":
                - heading "Layers" [level=2]
                - text: Select a layer to edit its numbers
                - listbox "Image layers":
                    - option /Click marker x \d+ y \d+ r \d+/:
                        - code: /x \d+ y \d+ r \d+/
                    - option /rectangle x \d+ y \d+ w \d+ h \d+/:
                        - code: /x \d+ y \d+ w \d+ h \d+/
                    - option /text · Owners only x \d+ y \d+/:
                        - code: /x \d+ y \d+/
                    - option "Blur · email auto · applied":
                        - code: auto · applied
                    - option "Blur · card auto · applied":
                        - code: auto · applied
                - paragraph: The redacted source is missing. Replace this screenshot to edit its layers.
        - complementary "Step inspector":
            - tablist "Inspector":
                - tab "Step"
                - tab "Target" [selected]
                - tab "Redact"
                - tab "History"
            - tabpanel "Target":
                - text: Action
                - combobox "Action":
                    - option "click" [selected]
                    - option "dblclick"
                    - option "fill"
                    - option "select"
                    - option "check"
                    - option "uncheck"
                    - option "press"
                    - option "hover"
                    - option "upload"
                    - option "navigate"
                    - option "assert"
                    - option "wait"
                - region "Target":
                    - heading "Target" [level=2]
                    - text: Replay order
                    - list "Ordered target locators":
                        - listitem:
                            - 'button "Edit locator 1: role button"':
                                - code: button "Change plan"
                        - listitem:
                            - 'button "Edit locator 2: testId billing-change-plan"':
                                - code: billing-change-plan
                        - listitem:
                            - 'button "Edit locator 3: text Change plan"':
                                - code: Change plan
                        - listitem:
                            - 'button "Edit locator 4: css section.plan > button"':
                                - code: section.plan > button
                        - listitem:
                            - 'button "Edit locator 5: xpath //main//section[1]//button"':
                                - code: //main//section[1]//button
                    - button "Add locator"
                - text: Page URL
                - textbox "Page URL": https://app.ledgerly.io/settings/billing
                - switch "Strip query strings and fragments, enforced in browser mode" [checked] [disabled]
                - text: Queries and fragments always removed
                - heading "Expect after this step" [level=2]
                - group: dialog "Choose a plan" is visible
                - button "Open live page"
                - button "Copy Playwright"
                - text: 'await page.getByRole("button", { name: "Change plan", exact: true }).click();'
                - group: Role and accessible name
