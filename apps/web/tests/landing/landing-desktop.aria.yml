  - region "Capture, edit, redact, publish.":
    - paragraph: Workflow
    - heading "Capture, edit, redact, publish." [level=2]
    - paragraph: Everything Scribe users expect, with the parts that usually cost extra built in.
    - article:
      - paragraph: "01"
      - heading "Capture" [level=3]
      - paragraph: Clicks, selects and navigation become steps with screenshots. Typed values never do.
      - figure "Example captured steps":
        - text: "01"
        - paragraph: Go to app.ledgerly.io/settings
        - code: navigate
        - text: "02"
        - paragraph: Click "Billing" in the sidebar
        - code: click · link
        - text: "03"
        - paragraph: Click "Change plan"
        - code: click · button
    - article:
      - paragraph: "02"
      - heading "Edit" [level=3]
      - paragraph: Rewrite, reorder, merge. Each step keeps role, name and selectors for replay.
      - figure "Example ranked locators":
        - code: role
        - code: button "Change plan"
        - text: Unique
        - code: testId
        - code: billing-change-plan
        - text: Unique
        - code: css
        - code: section.plan > button
        - text: Fragile
    - article:
      - paragraph: "03"
      - heading "Redact" [level=3]
      - paragraph: Emails, cards and tokens are pixelated before the screenshot leaves your tab.
      - figure "Example blurred email":
        - img "Blurred invoice email"
        - text: Email · blurred before upload
    - article:
      - paragraph: "04"
      - heading "Publish" [level=3]
      - paragraph: PDF, HTML, Markdown, DOCX, public links, embeds and static sites.
      - figure "Publishing interface preview":
