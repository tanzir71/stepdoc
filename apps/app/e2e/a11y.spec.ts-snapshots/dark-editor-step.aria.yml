      - text: click · button app.ledgerly.io/settings/billing
      - region "Layers":
        - heading "Layers" [level=2]
        - text: Select a layer to edit its numbers
        - listbox "Image layers":
          - option /Click marker x \d+ y \d+ r \d+/ [selected]:
            - code: /x \d+ y \d+ r \d+/
          - option /rectangle x \d+ y \d+ w \d+ h \d+/:
            - code: /x \d+ y \d+ w \d+ h \d+/
          - option /text · Owners only x \d+ y \d+/:
            - code: /x \d+ y \d+/
          - option "Blur · email auto · applied":
            - code: auto · applied
          - option "Blur · card auto · applied":
            - code: auto · applied
        - button "Add click marker"
        - button "Replace image"
